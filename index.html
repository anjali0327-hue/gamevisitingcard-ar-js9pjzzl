<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <!-- A-Frame and AR.js Core Libraries -->
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
        <!-- HTML Embed / Canvas Renderer for HTML in 3D Space -->
        <script src="https://supereight.github.io/aframe-html-embed/dist/aframe-html-embed.min.js"></script>

        <style>
            /* HTML Container for 3D Floating AR Pop-up Card */
            .ar-card {
                width: 380px;
                min-height: 240px;
                background: rgba(18, 18, 24, 0.88);
                border: 2px solid #ff9933;
                border-radius: 20px;
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                padding: 18px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-shadow: 0 0 25px rgba(255, 153, 51, 0.5);
                backdrop-filter: blur(10px);
            }

            .ar-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid rgba(255, 255, 255, 0.2);
                padding-bottom: 8px;
            }

            .ar-header h2 {
                margin: 0;
                font-size: 1.05rem;
                color: #ff9933;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .ar-body {
                display: flex;
                gap: 12px;
                margin-top: 10px;
                align-items: center;
            }

            .ar-body img {
                width: 90px;
                height: 90px;
                border-radius: 12px;
                object-fit: cover;
                border: 1px solid #138808;
            }

            .ar-body p {
                margin: 0;
                font-size: 0.85rem;
                line-height: 1.4;
                color: #e0e0e0;
                flex: 1;
            }

            .ar-footer {
                font-size: 0.75rem;
                color: #aaa;
                text-align: center;
                font-style: italic;
                margin-top: 10px;
            }
        </style>

        <script>
            // Full KHEL ADDA Dataset (Pop-up sequence on every click)
            const khelAddaData = [
                {
                    title: "🎲 KHEL ADDA — REIMAGINING CLASSICS",
                    text: "An Indian board game design studio dedicated to reviving traditional and nostalgic Indian games through contemporary game mechanics, storytelling, and visual design.",
                    image: "https://via.placeholder.com/100/ff9933/ffffff?text=KHEL+ADDA"
                },
                {
                    title: "🎯 WHAT WE SPECIALIZE IN",
                    text: "Taking games people already know—Carrom, Pachisi, Chowka Bara, Gilli Danda, Pallankuzhi, Snakes & Ladders—and redesigning the way they are played without losing what makes them Indian.",
                    image: "https://via.placeholder.com/100/138808/ffffff?text=Specialization"
                },
                {
                    title: "💡 CORE PHILOSOPHY",
                    text: "Don't preserve Indian games in a museum. Put them back on the table. We treat traditional games as raw material for innovation, allowing their mechanics, stories, and experiences to evolve.",
                    image: "https://via.placeholder.com/100/000080/ffffff?text=Philosophy"
                },
                {
                    title: "🛠️ MIXING OLD + NEW MECHANICS",
                    text: "Combining traditional gameplay systems with modern mechanics: Deck building, Set collection, Hidden info, Bluffing, Resource management, Worker placement, Area control, & Player powers.",
                    image: "https://via.placeholder.com/100/ff9933/ffffff?text=Mechanics"
                },
                {
                    title: "📖 INDIAN STORIES AS GAMEPLAY",
                    text: "Rather than simply putting Indian artwork onto existing mechanics, KHEL ADDA uses Indian mythology, folklore, communities, festivals, and histories as actual gameplay systems.",
                    image: "https://via.placeholder.com/100/138808/ffffff?text=Storytelling"
                },
                {
                    title: "🏆 CARROM: STREET CHAMPIONS",
                    text: "Example: Players choose neighborhood characters with unique abilities, complete objective cards, trigger special rule changes, and compete across strategic Indian environments!",
                    image: "https://via.placeholder.com/100/000080/ffffff?text=Carrom"
                }
            ];

            let currentIndex = 0;
            let isRolling = false;

            AFRAME.registerComponent('dice-popup-interaction', {
                init: function () {
                    const el = this.el;
                    const cardTitle = document.getElementById('card-title');
                    const cardText = document.getElementById('card-text');
                    const cardImg = document.getElementById('card-img');
                    const cardHint = document.getElementById('card-hint');

                    el.addEventListener('click', function () {
                        if (isRolling) return;
                        isRolling = true;

                        // Fluid spring-bounce animation on click
                        const rollDur = 1000;
                        const targetRotX = Math.floor(Math.random() * 6 + 2) * 360 + (Math.floor(Math.random() * 4) * 90);
                        const targetRotY = Math.floor(Math.random() * 6 + 2) * 360 + (Math.floor(Math.random() * 4) * 90);
                        
                        // Upward hop + multi-axis spin animation
                        el.setAttribute('animation__bounce', {
                            property: 'position',
                            to: '0 0.8 0',
                            dur: rollDur / 2,
                            dir: 'alternate',
                            loop: 1,
                            easing: 'easeOutQuad'
                        });

                        el.setAttribute('animation__spin', {
                            property: 'rotation',
                            to: `${targetRotX} ${targetRotY} ${targetRotX / 2}`,
                            dur: rollDur,
                            easing: 'easeOutCubic'
                        });

                        setTimeout(() => {
                            isRolling = false;

                            // Update data popup index on each click
                            const data = khelAddaData[currentIndex];
                            cardTitle.textContent = data.title;
                            cardText.textContent = data.text;
                            cardImg.src = data.image;

                            // Advance to the next info layer for the next tap
                            currentIndex = (currentIndex + 1) % khelAddaData.length;
                            cardHint.textContent = `Tap dice for next card (${currentIndex + 1}/${khelAddaData.length})`;
                        }, rollDur);
                    });
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true; colorManagement: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="dice-model" src="assets/asset.glb"></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                emitevents="true"
            >
                <!-- Interactive 3D Dice Object -->
                <a-entity
                    id="dice"
                    scale="0.2 0.2 0.2"
                    position="0 0.2 0"
                    gltf-model="#dice-model"
                    class="clickable"
                    gesture-handler
                    dice-popup-interaction
                ></a-entity>

                <!-- Floating Transparent AR Pop-up Display (Positioned Above the Dice) -->
                <a-entity 
                    position="0 1.8 0" 
                    rotation="-10 0 0"
                    html-embed="transparent: true"
                >
                    <div class="ar-card">
                        <div class="ar-header">
                            <h2 id="card-title">🎲 KHEL ADDA</h2>
                        </div>
                        <div class="ar-body">
                            <img id="card-img" src="https://via.placeholder.com/100/ff9933/ffffff?text=KHEL+ADDA" alt="Khel Adda Visual" />
                            <p id="card-text">Tap the 3D dice to explore KHEL ADDA and discover how we are bringing traditional Indian board games back to your table!</p>
                        </div>
                        <div class="ar-footer" id="card-hint">
                            Tap the 3D dice to start exploring (1/6)
                        </div>
                    </div>
                </a-entity>
            </a-marker>

            <!-- Camera with Raycaster for Click/Tap Detection -->
            <a-entity camera>
                <a-cursor
                    raycaster="objects: .clickable"
                    emitevents="true"
                    cursor="fuse: false; rayOrigin: mouse;"
                ></a-cursor>
            </a-entity>
        </a-scene>
    </body>
</html>
