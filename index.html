<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <!-- A-Frame and AR.js Core Libraries -->
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
        <!-- HTML Embed / Canvas Renderer for HTML in 3D Space -->
        <script src="https://supereight.github.io/aframe-html-embed/dist/aframe-html-embed.min.js"></script>

        <style>
            /* HTML Container for 3D Floating AR Screen */
            .ar-card {
                width: 400px;
                height: 260px;
                background: rgba(18, 18, 24, 0.82);
                border: 2px solid #ff9933;
                border-radius: 20px;
                color: #ffffff;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                padding: 16px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                box-shadow: 0 0 20px rgba(255, 153, 51, 0.4);
            }

            .ar-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid rgba(255, 255, 255, 0.2);
                padding-bottom: 8px;
            }

            .ar-header h2 {
                margin: 0;
                font-size: 1.1rem;
                color: #ff9933;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .ar-body {
                display: flex;
                gap: 12px;
                margin-top: 10px;
                align-items: center;
            }

            .ar-body img {
                width: 100px;
                height: 100px;
                border-radius: 12px;
                object-fit: cover;
                border: 1px solid #138808;
            }

            .ar-body p {
                margin: 0;
                font-size: 0.85rem;
                line-height: 1.35;
                color: #e0e0e0;
                flex: 1;
            }

            .ar-footer {
                font-size: 0.75rem;
                color: #888;
                text-align: center;
                font-style: italic;
                margin-top: 6px;
            }
        </style>

        <script>
            // KHEL ADDA Dataset
            const khelAddaData = [
                {
                    title: "🎲 ROLL A 6 TO UNLOCK",
                    text: "Tap the dice to roll a 6 and discover how KHEL ADDA is bringing traditional Indian board games back to your table!",
                    image: "https://via.placeholder.com/100/ff9933/ffffff?text=KHEL+ADDA"
                },
                {
                    title: "🚩 KHEL ADDA — REIMAGINING CLASSICS",
                    text: "An Indian board game design studio dedicated to reviving traditional and nostalgic Indian games through modern mechanics & storytelling.",
                    image: "https://via.placeholder.com/100/138808/ffffff?text=Classics"
                },
                {
                    title: "💡 CORE PHILOSOPHY",
                    text: "Don't preserve Indian games in a museum. Put them back on the table. We preserve cultural identity while evolving gameplay mechanics.",
                    image: "https://via.placeholder.com/100/000080/ffffff?text=Philosophy"
                },
                {
                    title: "🛠️ MIXING OLD + NEW MECHANICS",
                    text: "Blending Pachisi, Chowka Bara, and Gilli Danda with modern deck-building, worker placement, bluffing, and unique player powers.",
                    image: "https://via.placeholder.com/100/ff9933/ffffff?text=Mechanics"
                },
                {
                    title: "🎯 CARROM: STREET CHAMPIONS",
                    text: "Classic Carrom with neighborhood characters, special abilities, objective cards, temporary rule changes, and regional board designs!",
                    image: "https://via.placeholder.com/100/138808/ffffff?text=Carrom"
                }
            ];

            let hasUnlocked = false;
            let currentIndex = 0;
            let isRolling = false;

            AFRAME.registerComponent('fluid-dice-interaction', {
                init: function () {
                    const el = this.el;
                    const cardTitle = document.getElementById('card-title');
                    const cardText = document.getElementById('card-text');
                    const cardImg = document.getElementById('card-img');
                    const cardHint = document.getElementById('card-hint');

                    el.addEventListener('click', function () {
                        if (isRolling) return;
                        isRolling = true;

                        // Fluid spring-bounce animation simulating physical roll
                        const rollDur = 1200;
                        const targetRotX = Math.floor(Math.random() * 8 + 4) * 360 + (hasUnlocked ? Math.floor(Math.random() * 4) * 90 : 0);
                        const targetRotY = Math.floor(Math.random() * 8 + 4) * 360 + (hasUnlocked ? Math.floor(Math.random() * 4) * 90 : 0);
                        
                        // Upward hop + multi-axis spin
                        el.setAttribute('animation__bounce', {
                            property: 'position',
                            to: '0 0.8 0',
                            dur: rollDur / 2,
                            dir: 'alternate',
                            loop: 1,
                            easing: 'easeOutQuad'
                        });

                        el.setAttribute('animation__spin', {
                            property: 'rotation',
                            to: `${targetRotX} ${targetRotY} ${targetRotX / 2}`,
                            dur: rollDur,
                            easing: 'easeOutCubic'
                        });

                        setTimeout(() => {
                            isRolling = false;

                            if (!hasUnlocked) {
                                // First roll triggers the "Got a 6!" reveal
                                hasUnlocked = true;
                                currentIndex = 1; // First info slide
                                cardHint.textContent = "🎲 Got a 6! Tap again to cycle information.";
                            } else {
                                // Subsequent single taps change information layer
                                currentIndex = (currentIndex % (khelAddaData.length - 1)) + 1;
                            }

                            const data = khelAddaData[currentIndex];
                            cardTitle.textContent = data.title;
                            cardText.textContent = data.text;
                            cardImg.src = data.image;
                        }, rollDur);
                    });
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true; colorManagement: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="dice-model" src="assets/asset.glb"></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                emitevents="true"
            >
                <!-- Interactive 3D Dice Object -->
                <a-entity
                    id="dice"
                    scale="0.2 0.2 0.2"
                    position="0 0.2 0"
                    gltf-model="#dice-model"
                    class="clickable"
                    gesture-handler
                    fluid-dice-interaction
                ></a-entity>

                <!-- Floating 3D AR Transparent UI Display (Positioned Directly Above the Dice) -->
                <a-entity 
                    position="0 1.8 0" 
                    rotation="-10 0 0"
                    html-embed="transparent: true"
                >
                    <div class="ar-card">
                        <div class="ar-header">
                            <h2 id="card-title">🎲 ROLL A 6 TO UNLOCK</h2>
                        </div>
                        <div class="ar-body">
                            <img id="card-img" src="https://via.placeholder.com/100/ff9933/ffffff?text=KHEL+ADDA" alt="Khel Adda Visual" />
                            <p id="card-text">Tap the dice to roll a 6 and discover how KHEL ADDA is bringing traditional Indian board games back to your table!</p>
                        </div>
                        <div class="ar-footer" id="card-hint">
                            Tap the 3D dice to roll for the first time
                        </div>
                    </div>
                </a-entity>
            </a-marker>

            <!-- Camera with Raycaster for Click/Tap Detection -->
            <a-entity camera>
                <a-cursor
                    raycaster="objects: .clickable"
                    emitevents="true"
                    cursor="fuse: false; rayOrigin: mouse;"
                ></a-cursor>
            </a-entity>
        </a-scene>
    </body>
</html>
