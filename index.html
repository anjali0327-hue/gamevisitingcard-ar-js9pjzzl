<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <!-- A-Frame and AR.js Core Libraries -->
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <style>
            /* Glassmorphism Info Overlay */
            #info-card {
                position: fixed;
                bottom: 25px;
                left: 50%;
                transform: translateX(-50%);
                width: 85%;
                max-width: 360px;
                background: rgba(20, 20, 25, 0.88);
                color: #ffffff;
                padding: 18px;
                border-radius: 16px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.18);
                z-index: 9999;
                text-align: center;
                box-sizing: border-box;
            }

            #info-card h3 {
                margin: 0 0 8px 0;
                color: #0078f2;
                font-size: 1.2rem;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            #info-card p {
                margin: 0;
                font-size: 0.95rem;
                line-height: 1.4;
                color: #e0e0e0;
            }

            #info-card .hint {
                display: block;
                margin-top: 10px;
                font-size: 0.75rem;
                color: #888;
                font-style: italic;
            }
        </style>

        <script>
            // Gaming Company Data Array
            const gamingCompanyData = [
                {
                    title: "🎮 Company Profile",
                    text: "Epic Games — Founded in 1991. Leading developer in interactive entertainment and 3D engine technology."
                },
                {
                    title: "🔥 Flagship Titles",
                    text: "Creators of Fortnite, Unreal Tournament, Gears of War, and Fall Guys."
                },
                {
                    title: "⚡ Core Tech",
                    text: "Unreal Engine 5 — Powering next-gen photorealistic graphics across games, film, and AR/VR."
                },
                {
                    title: "🛍️ Ecosystem",
                    text: "Epic Games Store & Fab — Delivering global distribution and digital assets for millions of creators."
                },
                {
                    title: "💼 Careers & Studio",
                    text: "Headquartered in Cary, NC. Hiring globally across game design, real-time 3D, and engineering."
                }
            ];

            let currentIndex = 0;

            // Interactive Click Component
            AFRAME.registerComponent('dice-click-handler', {
                init: function () {
                    const el = this.el;
                    const cardTitle = document.getElementById('card-title');
                    const cardText = document.getElementById('card-text');

                    el.addEventListener('click', function () {
                        // Randomize target rotation angles to simulate a dice roll
                        const randomX = Math.floor(Math.random() * 4 + 2) * 360 + (Math.floor(Math.random() * 4) * 90);
                        const randomY = Math.floor(Math.random() * 4 + 2) * 360 + (Math.floor(Math.random() * 4) * 90);

                        // Animate 3D object rotation
                        el.setAttribute('animation', {
                            property: 'rotation',
                            to: `${randomX} ${randomY} 0`,
                            dur: 1000,
                            easing: 'easeOutQuad'
                        });

                        // Cycle through information layers on complete
                        setTimeout(() => {
                            currentIndex = (currentIndex + 1) % gamingCompanyData.length;
                            const data = gamingCompanyData[currentIndex];
                            
                            cardTitle.textContent = data.title;
                            cardText.textContent = data.text;
                        }, 500);
                    });
                }
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <!-- Dynamic Overlay UI -->
        <div id="info-card">
            <h3 id="card-title">🎲 Tap the Dice</h3>
            <p id="card-text">Scan the marker and click on the 3D dice to explore information layers about Epic Games.</p>
            <span class="hint">Tap object in AR view to roll</span>
        </div>

        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                emitevents="true"
            >
                <a-entity
                    id="bowser-model"
                    scale="0.2 0.2 0.2"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                    dice-click-handler
                ></a-entity>
            </a-marker>

            <!-- Camera with Raycaster for Click/Tap Detection -->
            <a-entity camera>
                <a-cursor
                    raycaster="objects: .clickable"
                    emitevents="true"
                    cursor="fuse: false; rayOrigin: mouse;"
                ></a-cursor>
            </a-entity>
        </a-scene>
    </body>
</html>
