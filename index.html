<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <!-- A-Frame and AR.js Core Libraries -->
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

        <style>
            /* Dynamic Wide Popup Card aesthetics */
            .ar-popup-card {
                position: fixed;
                width: 340px; /* Increased width */
                background: rgba(18, 18, 26, 0.94);
                border: 2px solid #FF9800;
                border-radius: 18px;
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                padding: 0;
                box-sizing: border-box;
                box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 0 20px rgba(255, 152, 0, 0.4);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                z-index: 999999;
                pointer-events: auto;
                transform: translate(-50%, -100%);
                animation: popupScaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                overflow: hidden;
            }

            /* Tooltip pointer pointing directly to tap point */
            .ar-popup-card::after {
                content: '';
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 10px 10px 0;
                border-style: solid;
                border-color: #FF9800 transparent;
                display: block;
                width: 0;
            }

            @keyframes popupScaleUp {
                from {
                    opacity: 0;
                    transform: translate(-50%, -80%) scale(0.85);
                }
                to {
                    opacity: 1;
                    transform: translate(-50%, -100%) scale(1);
                }
            }

            /* Large Featured Banner Image on top */
            .ar-banner-container {
                width: 100%;
                height: 140px; /* Big hero image layout */
                position: relative;
                overflow: hidden;
                background: #111;
            }

            .ar-banner-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* Close Button */
            .ar-close-btn {
                position: absolute;
                top: 8px;
                right: 10px;
                background: rgba(0, 0, 0, 0.65);
                color: #FF9800;
                border: 1px solid #FF9800;
                border-radius: 50%;
                width: 26px;
                height: 26px;
                font-size: 16px;
                line-height: 24px;
                text-align: center;
                cursor: pointer;
                font-weight: bold;
                z-index: 10;
            }

            .ar-card-content {
                padding: 14px 16px 16px 16px;
            }

            .ar-header h2 {
                margin: 0 0 8px 0;
                font-size: 0.95rem;
                color: #FF9800;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.6px;
            }

            .ar-body p {
                margin: 0;
                font-size: 0.82rem;
                line-height: 1.4;
                color: #E0E0E0;
            }

            .ar-footer {
                font-size: 0.7rem;
                color: #FFB74D;
                text-align: right;
                font-weight: 600;
                margin-top: 10px;
                letter-spacing: 0.4px;
            }

            /* Initial interaction hint */
            #tap-prompt {
                position: fixed;
                bottom: 25px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                border: 1.5px solid #FF9800;
                color: #ffffff;
                padding: 10px 22px;
                border-radius: 25px;
                font-family: sans-serif;
                font-size: 0.85rem;
                font-weight: 600;
                z-index: 99999;
                pointer-events: none;
                box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            }
        </style>

        <script>
            // KHEL ADDA Dataset
            const khelAddaData = [
                {
                    title: "🎲 KHEL ADDA — REIMAGINING CLASSICS",
                    text: "An Indian board game design studio reviving traditional Indian games through contemporary mechanics & visual design.",
                    image: "https://via.placeholder.com/400x180/ff9933/ffffff?text=KHEL+ADDA+STUDIO"
                },
                {
                    title: "🎯 WHAT WE SPECIALIZE IN",
                    text: "Redesigning familiar games like Carrom, Pachisi, Chowka Bara, & Gilli Danda with fresh strategic mechanics.",
                    image: "https://via.placeholder.com/400x180/138808/ffffff?text=SPECIALIZATION"
                },
                {
                    title: "💡 CORE PHILOSOPHY",
                    text: "Don't preserve Indian games in a museum. Put them back on the table while allowing mechanics and stories to evolve.",
                    image: "https://via.placeholder.com/400x180/000080/ffffff?text=CORE+PHILOSOPHY"
                },
                {
                    title: "🛠️ MIXING OLD + NEW MECHANICS",
                    text: "Combining classic gameplay with deck building, hidden info, worker placement, and variable player powers.",
                    image: "https://via.placeholder.com/400x180/ff9933/ffffff?text=GAME+MECHANICS"
                },
                {
                    title: "📖 INDIAN STORIES AS GAMEPLAY",
                    text: "Using Indian mythology, folklore, festivals, and history as actual gameplay systems rather than just artwork.",
                    image: "https://via.placeholder.com/400x180/138808/ffffff?text=STORYTELLING"
                },
                {
                    title: "🏆 CARROM: STREET CHAMPIONS",
                    text: "Choose neighborhood characters with unique abilities, complete objectives, and challenge opponents on regional boards!",
                    image: "https://via.placeholder.com/400x180/000080/ffffff?text=CARROM+STREET+CHAMPIONS"
                }
            ];

            let currentIndex = 0;
            let isRolling = false;
            let tapCoords = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

            // Record tap location on touch/click
            function recordTap(evt) {
                if (evt.touches && evt.touches.length > 0) {
                    tapCoords.x = evt.touches[0].clientX;
                    tapCoords.y = evt.touches[0].clientY;
                } else if (evt.clientX) {
                    tapCoords.x = evt.clientX;
                    tapCoords.y = evt.clientY;
                }
            }

            window.addEventListener('touchstart', recordTap, { passive: true });
            window.addEventListener('pointerdown', recordTap, { passive: true });

            AFRAME.registerComponent('dice-popup-interaction', {
                init: function () {
                    const el = this.el;
                    const prompt = document.getElementById('tap-prompt');

                    el.addEventListener('click', function () {
                        if (isRolling) return;
                        isRolling = true;

                        if (prompt) prompt.style.display = 'none';

                        // Physics bounce & spin roll animation on the dice
                        const rollDur = 700;
                        const targetRotX = Math.floor(Math.random() * 4 + 2) * 360 + (Math.floor(Math.random() * 4) * 90);
                        const targetRotY = Math.floor(Math.random() * 4 + 2) * 360 + (Math.floor(Math.random() * 4) * 90);

                        el.setAttribute('animation__bounce', {
                            property: 'position',
                            to: '0 0.5 0',
                            dur: rollDur / 2,
                            dir: 'alternate',
                            loop: 1,
                            easing: 'easeOutQuad'
                        });

                        el.setAttribute('animation__spin', {
                            property: 'rotation',
                            to: `${targetRotX} ${targetRotY} ${targetRotX / 2}`,
                            dur: rollDur,
                            easing: 'easeOutCubic'
                        });

                        setTimeout(() => {
                            isRolling = false;

                            // Create a brand NEW popup card element on every click
                            createNewPopupCard(tapCoords.x, tapCoords.y);

                            // Advance to the next content entry for the next click
                            currentIndex = (currentIndex + 1) % khelAddaData.length;
                        }, rollDur);
                    });
                }
            });

            // Spawns a new popup card DOM element at (x, y)
            function createNewPopupCard(x, y) {
                const data = khelAddaData[currentIndex];

                const card = document.createElement('div');
                card.className = 'ar-popup-card';

                // Screen position bounds checking
                let posX = x;
                let posY = y - 20;
                const popupWidth = 340;
                const popupHeight = 280;

                if (posX - popupWidth / 2 < 12) posX = popupWidth / 2 + 12;
                if (posX + popupWidth / 2 > window.innerWidth - 12) posX = window.innerWidth - popupWidth / 2 - 12;
                if (posY - popupHeight < 10) posY = y + popupHeight + 20;

                card.style.left = `${posX}px`;
                card.style.top = `${posY}px`;

                // Build HTML structure with Big Banner Image on top
                card.innerHTML = `
                    <div class="ar-banner-container">
                        <span class="ar-close-btn" onclick="this.closest('.ar-popup-card').remove()">&times;</span>
                        <img src="${data.image}" alt="Khel Adda Visual" />
                    </div>
                    <div class="ar-card-content">
                        <div class="ar-header">
                            <h2>${data.title}</h2>
                        </div>
                        <div class="ar-body">
                            <p>${data.text}</p>
                        </div>
                        <div class="ar-footer">
                            CARD ${currentIndex + 1} OF ${khelAddaData.length}
                        </div>
                    </div>
                `;

                document.body.appendChild(card);
            }
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <!-- Initial Helper Prompt -->
        <div id="tap-prompt">🎲 Tap the 3D dice to spawn information</div>

        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true; colorManagement: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="dice-model" src="assets/asset.glb"></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                emitevents="true"
            >
                <!-- Interactive 3D Dice Object -->
                <a-entity
                    id="dice"
                    scale="0.2 0.2 0.2"
                    position="0 0.2 0"
                    gltf-model="#dice-model"
                    class="clickable"
                    gesture-handler
                    dice-popup-interaction
                ></a-entity>
            </a-marker>

            <!-- Camera Setup for Touch Detection -->
            <a-entity camera>
                <a-cursor
                    raycaster="objects: .clickable"
                    emitevents="true"
                    cursor="fuse: false; rayOrigin: mouse;"
                ></a-cursor>
            </a-entity>
        </a-scene>
    </body>
</html>
